{% extends "base.html" %}
{% block title %}Log in - FoodRescue Connect{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Log in</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" value="{{ request.form.email }}" required autofocus></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="aside">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
